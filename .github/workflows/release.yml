name: Release

# Merging dev into main is how updates ship. On every push to main,
# release-please opens or updates a release PR (version bump + CHANGELOG.md).
# This workflow turns on auto-merge for that PR, so it merges itself once CI
# passes. When it merges, release-please tags vX.Y.Z, publishes the GitHub
# release, and this workflow opens a PR that syncs main back into dev and
# publishes the docs site for the new tag (site.yml) and stages the package
# on npm for a maintainer to approve (the npm job below).
#
# RELEASE_TOKEN is a fine-grained personal access token (contents, pull
# requests and workflows: read and write on this repository). The built-in
# GITHUB_TOKEN can't be used: PRs and tags it creates don't trigger other
# workflows, so CI would never run on the release PR and it could not merge.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Auto-merge the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # Parsed in the shell, not with fromJSON(): `pr` can be empty even
          # when prs_created is true, and fromJSON('') fails the whole job.
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          number=$(printf '%s' "$PR_JSON" | jq -r '.number // empty' 2>/dev/null || true)
          if [ -z "$number" ]; then
            echo "No release PR to auto-merge."
            exit 0
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --merge

      - name: Sync main back into dev
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          # Merging the dev→main PR can auto-delete dev (it was that PR's head
          # branch). Put it back at the release commit; nothing is lost, since
          # main holds all of dev's history.
          if ! gh api "repos/$GITHUB_REPOSITORY/branches/dev" --silent 2>/dev/null; then
            echo "dev is missing; recreating it from main."
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/dev -f sha="$GITHUB_SHA" --silent
            exit 0
          fi
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/dev...main" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "dev already has everything on main."
            exit 0
          fi
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base dev --head main --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            existing=$(gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head main \
              --title "chore: sync $TAG into dev" \
              --body "Brings the $TAG release commit (versions and CHANGELOG.md) back into dev. Merges itself once CI passes." \
              | sed 's#.*/##')
          fi
          gh pr merge "$existing" --repo "$GITHUB_REPOSITORY" --auto --merge

  # Stages packages/watchwright on npm through trusted publishing: npm trusts
  # this workflow file (set up once on npmjs.com, package settings > Trusted
  # publisher), so there is no npm token, and every version gets a provenance
  # statement linking it to this repository and commit. A staged version goes
  # live only when a maintainer approves it with 2FA (Staged Packages tab on
  # npmjs.com, or `npm stage approve`), so this workflow alone can't ship one.
  # "Run workflow" by hand on main stages main's version if it isn't on npm yet
  # (to retry a failed run); a version already on npm is skipped.
  npm:
    needs: release
    if: needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name || github.sha }}
      - uses: pnpm/action-setup@v4
      # No registry-url: it writes an .npmrc that expects NODE_AUTH_TOKEN, which
      # gets in the way of trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Staged publishing needs npm 11.15.0 or newer.
      - run: npm install -g npm@^11.15.0
      - id: version
        working-directory: packages/watchwright
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Prints nothing (and still exits 0) when the package exists but this version doesn't.
          if [ -n "$(npm view "watchwright@$version" version 2>/dev/null)" ]; then
            echo "watchwright@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.version.outputs.publish == 'true'
        run: pnpm build
      - if: steps.version.outputs.publish == 'true'
        run: pnpm --filter watchwright check-package
      - name: Stage watchwright@${{ steps.version.outputs.version }} for approval
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/watchwright
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out=$(npm stage publish --access public --json)
          echo "$out"
          id=$(printf '%s' "$out" | jq -r '.stageId // .stage_id // .id // empty' 2>/dev/null || true)
          {
            echo "### watchwright@$VERSION is staged on npm"
            echo
            echo "It goes live once a maintainer approves it with 2FA: the Staged Packages tab on https://www.npmjs.com/package/watchwright, or \`npm stage approve ${id:-<id from npm stage list watchwright>}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  site:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ needs.release.outputs.tag_name }}
    permissions:
      contents: read
      pages: write
      id-token: write
