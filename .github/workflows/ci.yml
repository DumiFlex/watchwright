name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers (Linux)
        if: runner.os == 'Linux'
        run: pnpm --filter watchwright exec playwright install --with-deps chromium firefox
      - name: Install Playwright browsers (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter watchwright exec playwright install chromium firefox
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          WATCHWRIGHT_REQUIRE_BROWSERS: "1"
      - run: pnpm build
